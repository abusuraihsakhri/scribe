name: Deploy project site

on:
  pull_request:
    branches: [main]
    paths: ['site/**', 'tests/site.*', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tests/site.*', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test website
        run: node --test tests/site.test.mjs

  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/scribe-site-browser" --no-audit --no-fund --no-save playwright@1.56.1
      - name: Install Chromium with system dependencies
        run: "$RUNNER_TEMP/scribe-site-browser/node_modules/.bin/playwright" install chromium --with-deps
      - name: Test responsive layout in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/scribe-site-browser/node_modules/playwright
        run: node tests/site.browser.cjs

  deploy:
    needs: [test, browser-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
